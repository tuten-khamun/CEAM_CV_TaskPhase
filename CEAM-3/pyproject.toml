[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-motion-tracker"
version = "0.1.0"
description = "Classical Vehicle Motion Tracker using OpenCV, ORB/SIFT, and Lucas-Kanade Optical Flow"
authors = [{ name = "Maths & Computing Student" }]
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.5.0",
    "numpy>=1.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
